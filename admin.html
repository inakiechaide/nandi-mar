<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin de eventos | Nandi Mar</title>
<meta name="theme-color" content="#1E1712">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌿%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">
<header class="admin__bar">
  <div class="container admin__bar-inner">
    <a class="nav__brand" href="./">Nandi Mar</a>
    <span class="admin__tag">Admin</span>
    <div class="admin__nav">
      <button id="nav-events" class="btn btn--ghost btn--sm" type="button">Eventos</button>
      <button id="nav-sections" class="btn btn--ghost btn--sm" type="button">Secciones</button>
    </div>
    <button id="logout" class="btn btn--ghost btn--sm" type="button" hidden>Salir</button>
  </div>
</header>

<main class="container admin__main">
  <p id="toast" class="admin__toast" role="status" aria-live="polite"></p>

  <section id="view-loading" class="admin__view"><p class="admin__muted">Cargando…</p></section>

  <section id="view-login" class="admin__view" hidden>
    <form id="login-form" class="admin__card" autocomplete="on">
      <h1 class="admin__title">Ingresar</h1>
      <label class="field"><span>Usuario</span><input name="user" autocomplete="username" required></label>
      <label class="field"><span>Contraseña</span><input name="password" type="password" autocomplete="current-password" required></label>
      <p class="admin__error" data-error></p>
      <button class="btn" type="submit">Ingresar</button>
      <a class="btn btn--ghost" href="./">← Volver al sitio</a>
    </form>
  </section>


  <section id="view-events" class="admin__view" hidden>
    <div class="admin__head">
      <h1 class="admin__title">Eventos</h1>
      <button id="new-event" class="btn" type="button">+ Nuevo evento</button>
    </div>
    <div class="admin__tools">
      <label class="field field--inline"><span>Área</span><select id="filter-area"></select></label>
      <label class="check"><input id="filter-past" type="checkbox"> Mostrar pasados</label>
      <span class="admin__spacer"></span>
      <button id="download" class="btn btn--ghost btn--sm" type="button">Descargar JSON</button>
    </div>
    <ul id="event-list" class="admin__list"></ul>
  </section>

  <section id="view-sections" class="admin__view" hidden>
    <div class="admin__head">
      <h1 class="admin__title">Secciones</h1>
    </div>
    <ul id="sections-list" class="admin__list"></ul>
  </section>
</main>

<dialog id="event-dialog" class="admin__dialog">
  <form id="event-form" method="dialog" novalidate>
    <h2 class="admin__title" data-title>Nuevo evento</h2>
    <div class="grid">
      <label class="field field--wide"><span>Título *</span><input name="title" required maxlength="140"></label>
      <label class="field"><span>Área *</span><select name="area" required></select></label>
      <label class="field"><span>Estado *</span><select name="status" required></select></label>
      <label class="field"><span>Fecha *</span><input name="date" type="date" required></label>
      <label class="field"><span>Fecha de fin</span><input name="endDate" type="date"></label>
      <label class="field"><span>Lugar *</span><input name="place" required maxlength="140"></label>
      <label class="field"><span>Ciudad *</span><input name="city" required maxlength="80"></label>
      <label class="field"><span>País *</span><input name="country" required maxlength="80"></label>
      <label class="field"><span>Formato *</span><input name="type" required maxlength="80" placeholder="Concierto, Círculo, Retiro…"></label>
      <label class="field field--wide"><span>Link de reserva</span><input name="link" type="url" pattern="https?://.+" title="Tiene que empezar con http:// o https://" placeholder="https://wa.me/+5493456558498"></label>
      <label class="field field--wide"><span>Descripción</span><textarea name="description" rows="3" maxlength="600"></textarea></label>
    </div>
    <p class="admin__error" data-error></p>
    <div class="admin__actions">
      <button class="btn btn--ghost" type="button" data-cancel>Cancelar</button>
      <button class="btn" type="submit" value="save">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="about-dialog" class="admin__dialog">
  <form id="about-form" method="dialog" novalidate>
    <h2 class="admin__title">Editar "Sobre mí"</h2>
    <div class="grid">
      <label class="field"><span>ID</span><input name="aboutId" required></label>
      <label class="field"><span>Label de navegación</span><input name="aboutNavLabel" required></label>
      <label class="field field--wide"><span>Título</span><input name="aboutTitle" required></label>
      <label class="field field--wide"><span>Lead</span><textarea name="aboutLead" rows="2"></textarea></label>
      <label class="field field--wide"><span>Párrafos (separados por doble salto de línea)</span><textarea name="aboutParagraphs" rows="5"></textarea></label>
      <label class="field field--wide"><span>Quote</span><textarea name="aboutQuote" rows="2"></textarea></label>
    </div>
    <p class="admin__error" data-error></p>
    <div class="admin__actions">
      <button class="btn btn--ghost" type="button" data-cancel>Cancelar</button>
      <button class="btn" type="submit" value="save">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="areas-dialog" class="admin__dialog">
  <h2 class="admin__title">Áreas</h2>
  <ul id="areas-list" class="admin__list"></ul>
  <div class="admin__actions">
    <button class="btn btn--ghost" type="button" data-cancel>Cerrar</button>
    <button id="new-area" class="btn" type="button">+ Nueva área</button>
  </div>
</dialog>

<dialog id="area-dialog" class="admin__dialog">
  <form id="area-form" method="dialog" novalidate>
    <h2 class="admin__title" data-title>Nueva área</h2>
    <div class="grid">
      <label class="field"><span>ID *</span><input name="areaId" required></label>
      <label class="field"><span>Label de navegación *</span><input name="areaNavLabel" required></label>
      <label class="field field--wide"><span>Título *</span><input name="areaTitle" required></label>
      <label class="field"><span>Acento</span><select name="areaAccent">
        <option value="ocre">Ocre</option>
        <option value="terra">Tierra</option>
        <option value="musgo">Musgo</option>
        <option value="selva">Selva</option>
      </select></label>
      <label class="field field--wide"><span>Subtítulo</span><input name="areaSubtitle"></label>
      <label class="field field--wide"><span>Descripción</span><textarea name="areaDescription" rows="4"></textarea></label>
    </div>
    <p class="admin__error" data-error></p>
    <div class="admin__actions">
      <button class="btn btn--ghost" type="button" data-cancel>Cancelar</button>
      <button class="btn" type="submit" value="save">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="contact-dialog" class="admin__dialog">
  <form id="contact-form" method="dialog" novalidate>
    <h2 class="admin__title">Editar "Contacto y redes"</h2>
    <div class="grid">
      <label class="field"><span>ID</span><input name="contactId" required></label>
      <label class="field"><span>Label de navegación</span><input name="contactNavLabel" required></label>
      <label class="field field--wide"><span>Título</span><input name="contactTitle" required></label>
      <label class="field field--wide"><span>Texto</span><textarea name="contactText" rows="3"></textarea></label>
      <label class="field field--wide"><span>Redes sociales (JSON)</span><textarea name="socialsJson" rows="6"></textarea></label>
      <label class="field field--wide"><span>Email newsletter</span><input name="newsletterEmail"></label>
      <label class="field field--wide"><span>Título newsletter</span><input name="newsletterTitle"></label>
      <label class="field field--wide"><span>Label newsletter</span><input name="newsletterLabel"></label>
      <label class="field field--wide"><span>Placeholder newsletter</span><input name="newsletterPlaceholder"></label>
      <label class="field field--wide"><span>Botón newsletter</span><input name="newsletterButton"></label>
      <label class="field field--wide"><span>Estado enviando</span><input name="newsletterSending"></label>
      <label class="field field--wide"><span>Mensaje éxito</span><input name="newsletterSuccess"></label>
      <label class="field field--wide"><span>Mensaje error</span><input name="newsletterError"></label>
      <label class="field field--wide"><span>Nota newsletter</span><textarea name="newsletterNote" rows="2"></textarea></label>
    </div>
    <p class="admin__error" data-error></p>
    <div class="admin__actions">
      <button class="btn btn--ghost" type="button" data-cancel>Cancelar</button>
      <button class="btn" type="submit" value="save">Guardar</button>
    </div>
  </form>
</dialog>

<script type="module" src="js/admin/main.js"></script>
</body>
</html>
